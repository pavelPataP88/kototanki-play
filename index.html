const p=g.cat;if(!(p.inv>0&&Math.floor(t*9)%2===0)){if(p.valerian>0){ctx.shadowColor='#85ef78';ctx.shadowBlur=26;ctx.fillStyle='#aaf58980';ctx.beginPath();ctx.arc(p.x,p.y,20,0,7);ctx.fill()}if(p.shield>0){ctx.strokeStyle='#9ad8ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,18,0,7);ctx.stroke()}sprite(p.x,p.y,'cat',p.dir);ctx.shadowBlur=0}
for(const s of g.sparks){ctx.fillStyle=s.bomb?`rgba(255,209,80,${s.ttl/.85*.56})`:`rgba(255,245,153,${s.ttl/.45*.85})`;ctx.beginPath();ctx.arc(s.x,s.y,s.bomb?(1-s.ttl/.85)*110+10:(1-s.ttl/.45)*23+4,0,Math.PI*2);ctx.fill()}
if(p.valerian>0){rect(p.x-15,p.y-30,30*(p.valerian/10),4,'#b5ff8a')}
}
function updateHud(){if(!g)return;el('lvl').textContent=g.n+' / 30';el('home').textContent='❤'.repeat(clamp(g.home.hp,0,3));el('lives').textContent='❤'.repeat(clamp(g.cat.lives,0,5));el('left').textContent=g.toSpawn+g.dogs.length;el('score').textContent=g.score;el('bombCount').textContent=g.cat.bombs;const p=g.cat,parts=[];if(p.valerian>0)parts.push('🧪 Сквозь ВСЁ '+Math.ceil(p.valerian)+'с');if(p.double>0)parts.push('🌭 ×2 '+Math.ceil(p.double)+'с');if(p.rapid>0)parts.push('⚡ '+Math.ceil(p.rapid)+'с');if(p.shield>0)parts.push('🛡️ '+Math.ceil(p.shield)+'с');el('buff').textContent=parts.join(' · ')||'🐾 Защити домик!';el('feedback').textContent=g.n<30?'Уровень '+g.n:'Последний уровень'}
function frame(ts){raf=requestAnimationFrame(frame);let dt=Math.min((ts-last)/1000,.05);last=ts;if(g&&g.state==='playing')update(dt);if(g)draw()}
function bind(id,down,up){const node=el(id);node.addEventListener('pointerdown',e=>{e.preventDefault();node.setPointerCapture(e.pointerId);node.classList.add('pressed');down();beep(300,.02)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])node.addEventListener(evt,e=>{node.classList.remove('pressed');if(up)up()})}for(const button of document.querySelectorAll('[data-dir]')){let dir=button.dataset.dir;button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys.add(dir);button.classList.add('pressed')});for(let name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,()=>{keys.delete(dir);button.classList.remove('pressed')})}
bind('fire',()=>{holdingFire=true;shoot()},()=>{holdingFire=false});bind('bomb',explode);el('pause').addEventListener('click',()=>{if(!g||g.state==='end'||g.state==='next')return;if(g.state==='paused'){begin();el('pause').textContent='Ⅱ ПАУЗА'}else{g.state='paused';holdingFire=false;keys.clear();el('pause').textContent='▶ ПУСК';show('ПАУЗА','Кот отдыхает. Собаки подождут.','ПРОДОЛЖИТЬ ▶',()=>{begin();el('pause').textContent='Ⅱ ПАУЗА'})}});el('sound').addEventListener('click',()=>{music=!music;el('sound').textContent=music?'🔊':'🔇'});
window.addEventListener('keydown',e=>{let map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};if(map[e.code]){keys.add(map[e.code]);e.preventDefault()}if(e.code==='Space'){holdingFire=true;e.preventDefault()}if(e.code==='KeyB'){explode();e.preventDefault()}});window.addEventListener('keyup',e=>{let map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};if(map[e.code])keys.delete(map[e.code]);if(e.code==='Space')holdingFire=false});window.addEventListener('blur',()=>{keys.clear();holdingFire=false});el('start').onclick=()=>{level(1);begin()};level(1);draw();window.__gameDebug={get:()=>g,level,drop,update,explode,finish};
})();
</script></body></html>
