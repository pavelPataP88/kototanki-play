const SAVE_KEY='kototanki.save.v1';
function newSave(){return {version:1,unlocked:1,coins:0,bestScore:0,stars:{},cleared:{},upgrades:{armor:0,fort:0,rapid:0},skin:'ginger',audio:true,losses:0,finishes:0}}
function loadSave(){
  let data;
  try{data=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
  const fresh=newSave();
  if(!data||data.version!==1||typeof data!=='object')return fresh;
  const safeInt=(v,min,max)=>Number.isFinite(v)?Math.max(min,Math.min(max,Math.floor(v))):min;
  fresh.unlocked=safeInt(data.unlocked,1,30);
  fresh.coins=safeInt(data.coins,0,1000000);
  fresh.bestScore=safeInt(data.bestScore,0,100000000);
  fresh.losses=safeInt(data.losses,0,1000000);
  fresh.finishes=safeInt(data.finishes,0,1000000);
  for(const name of ['armor','fort','rapid'])fresh.upgrades[name]=safeInt(data.upgrades?.[name],0,2);
  if(data.stars&&typeof data.stars==='object')for(let n=1;n<=30;n++)fresh.stars[n]=safeInt(data.stars[n],0,3);
  if(data.cleared&&typeof data.cleared==='object')for(let n=1;n<=30;n++)if(data.cleared[n]===true)fresh.cleared[n]=true;
  fresh.skin=['ginger','ocean','violet'].includes(data.skin)?data.skin:'ginger';
  fresh.audio=data.audio!==false;

}

function buyUpgrade(id){
  if(!SHOP.some(item=>item.id===id))return false;
  const item=SHOP.find(item=>item.id===id),rank=save.upgrades[id],cost=item.cost[rank];

      const enabled=canUseSkin(id);

        save.skin=id;saveProgress();renderMetaPanel('menu');
      },!enabled);skins.appendChild(btn);
    }
  }
  if(mode==='menu'||mode==='between'){
    const shop=metaCard(panel,'УЛУЧШЕНИЯ ЗА МОНЕТЫ','metaRow');
    for(const item of SHOP){
      const rank=save.upgrades[item.id],cost=item.cost[rank],max=rank>=2;
      const label=item.icon+' '+item.name+' '+(max?'MAX':(rank+'/2 · '+cost+' 🪙'));

  if(mode!=='menu'){
    const footer=metaCard(panel,'','metaRow');
    footer.appendChild(elButton('☰ В главное меню',showMenu));
  }else{
    const guide=metaCard(panel,'ПРАВИЛА','metaHelp');
    guide.textContent='Стрелки / WASD или кнопки слева — движение. 🌭 / пробел — стрелять. 💣 / B — бомба. Не дай собакам разрушить дом! Побеждай, получай звёзды и улучшай кота.';
    const record=metaCard(panel,'','metaSmall');
    record.textContent='Лучший счёт: '+save.bestScore+' · Прохождений: '+save.finishes+' · Без рекламы и платных покупок.';
  }
}

function poly(points,fill,stroke=null,sw=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.stroke()}}

function randAt(x,y,n=0){let seed=Math.imul((x+1)*15731+(y+7)*789221+(n+3)*1376312589, 374761393);seed=(seed^(seed>>>13))*1274126177;return ((seed^(seed>>>16))>>>0)/4294967295}

/* Graphics MAX visual postprocess, no writes to game state */
let maxPrevTime=performance.now(),maxLastLevel=-1,maxSeen=new WeakSet(),maxParticles=[],maxFlash=0,maxShake=0;
let maxPrevLives=3,maxPrevHome=3,maxTick=0,maxFxFrames=0,maxFxFps=60,maxFxWindow=performance.now(),maxFxLow=MAX_LOW;
function maxRand(a,b){return a+Math.random()*(b-a)}
function maxPuff(x,y,kind,count){
 if(MAX_REDUCED)return;
 const colors=kind==='bomb'?['#ffe6a5','#ffb35e','#f17353','#fcf3c9']:kind==='heal'?['#abffe0','#fff1a4','#8ae2ba']:['#fff7d7','#ffde89','#ed945f'];
 for(let i=0;i<count&&maxParticles.length<145;i++){
  const angle=maxRand(0,Math.PI*2),speed=maxRand(20,kind==='bomb'?175:85),life=maxRand(.24,kind==='bomb'?.85:.65);
  maxParticles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-12,age:0,life:life,r:maxRand(1,kind==='bomb'?4.2:2.9),col:colors[i%colors.length]});
 }
}
function maxGlow(x,y,r,color){
 const grad=ctx.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,color);grad.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=grad;ctx.fillRect(x-r,y-r,2*r,2*r);
}
function maxTrail(x,y,vx,vy){
 ctx.save();ctx.lineCap='round';ctx.globalCompositeOperation='screen';
 ctx.strokeStyle='#ffca75';ctx.globalAlpha=.23;ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(x-vx*.06,y-vy*.06);ctx.lineTo(x,y);ctx.stroke();
 ctx.strokeStyle='#fff2c6';ctx.globalAlpha=.65;ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(x-vx*.035,y-vy*.035);ctx.lineTo(x,y);ctx.stroke();
 ctx.restore();
}
function maxPostProcess(time){
 if(!g)return;
 const now=time||performance.now(),dt=Math.min(.045,Math.max(0,(now-maxPrevTime)/1000));maxPrevTime=now;
 const p=g.cat,playing=g.state==='playing';
 if(now-maxFxWindow>3000){maxFxFps=Math.round(maxFxFrames*1000/Math.max(1,now-maxFxWindow));maxFxFrames=0;maxFxWindow=now;if(maxFxFps<27)maxFxLow=true;}
 maxFxFrames++;
 if(maxLastLevel!==g.n){maxLastLevel=g.n;maxSeen=new WeakSet();maxParticles.length=0;maxPrevLives=p.lives;maxPrevHome=g.home.hp;maxPuff(g.home.x,g.home.y,'heal',17);}
 for(const s of g.sparks){if(maxSeen.has(s))continue;maxSeen.add(s);maxPuff(s.x,s.y,s.bomb?'bomb':'hit',s.bomb?55:17);if(s.bomb){maxFlash=.25;maxShake=7}}
 for(const b of g.bonuses){if(maxSeen.has(b))continue;maxSeen.add(b);maxPuff(b.x,b.y,'heal',10)}
 if(g.home.hp<maxPrevHome){maxPuff(g.home.x,g.home.y,'hit',27);maxFlash=.15;maxShake=5}
 if(p.lives<maxPrevLives){maxPuff(p.x,p.y,'hit',20);maxFlash=.12;maxShake=5}
 maxPrevHome=g.home.hp;maxPrevLives=p.lives;
 ctx.save();
 ctx.globalCompositeOperation='screen';
 maxGlow(g.home.x,g.home.y-15,86,'rgba(255,207,113,.14)');
 maxGlow(p.x,p.y,55,p.shield>0?'rgba(115,213,255,.24)':'rgba(255,234,151,.13)');
 if(!maxFxLow)for(const d of g.dogs)if(d.hp<=1&&d.type>=3)maxGlow(d.x,d.y,18,'rgba(248,167,91,.085)');
 for(const s of g.shots){maxTrail(s.x,s.y,s.vx,s.vy);if(!maxFxLow)maxGlow(s.x,s.y,19,'rgba(255,188,91,.25)')}
 if(!MAX_REDUCED&&!maxFxLow&&playing)for(let i=0;i<11;i++){
   const x=(i*83.7+39)%416,y=(i*71.8+311-g.time*(5+i%3))%512;
   ctx.globalAlpha=.16+.13*Math.sin(g.time*1.4+i*1.9);ctx.fillStyle=i%3?'#ffe9af':'#b5fce2';
   ctx.beginPath();ctx.arc(x+Math.sin(g.time*.65+i)*6,(y+512)%512,1.1+(i%2)*.5,0,Math.PI*2);ctx.fill();
 }
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 for(let i=maxParticles.length-1;i>=0;i--){
   const e=maxParticles[i];if(playing)e.age+=dt;
   if(e.age>=e.life){maxParticles.splice(i,1);continue;}
   e.vy+=57*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
   const alpha=Math.pow(Math.max(0,1-e.age/e.life),1.25);
   ctx.globalAlpha=alpha;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,Math.max(.25,e.r*alpha),0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 const grade=ctx.createLinearGradient(0,0,416,512);
 grade.addColorStop(0,'rgba(255,250,187,.085)');grade.addColorStop(.48,'rgba(255,255,255,0)');grade.addColorStop(1,'rgba(20,129,220,.035)');
 ctx.fillStyle=grade;ctx.fillRect(0,0,416,512);
 const shade=ctx.createRadialGradient(208,225,126,208,235,358);
 shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(1,'rgba(10,66,95,.14)');
 ctx.fillStyle=shade;ctx.fillRect(0,0,416,512);
 if(maxFlash>0){ctx.fillStyle='rgba(255,225,162,'+Math.min(.29,maxFlash)+')';ctx.fillRect(0,0,416,512);maxFlash=Math.max(0,maxFlash-dt)}
 ctx.restore();
 if(maxShake>0&&!MAX_REDUCED){const amt=Math.min(4,maxShake*.8);c.style.transform='translate('+maxRand(-amt,amt).toFixed(1)+'px,'+maxRand(-amt,amt).toFixed(1)+'px)';maxShake=Math.max(0,maxShake-dt*23)}
 else if(c.style.transform)c.style.transform='';
}
window.__graphicsMax={version:'2.0',getStats:()=>({scale:MAX_SCALE,fxLow:maxFxLow,fps:maxFxFps,particles:maxParticles.length})};

function bind(id,down,up){const node=el(id);node.addEventListener('pointerdown',e=>{e.preventDefault();node.setPointerCapture(e.pointerId);node.classList.add('pressed');down();beep(300,.02)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])node.addEventListener(evt,e=>{node.classList.remove('pressed');if(up)up()})}for(const button of document.querySelectorAll('[data-dir]')){let dir=button.dataset.dir;button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys.add(dir);button.classList.add('pressed')});for(let name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,()=>{keys.delete(dir);button.classList.remove('pressed')})}
bind('fire',()=>{holdingFire=true;shoot()},()=>{holdingFire=false});bind('bomb',explode);el('pause').addEventListener('click',()=>{if(!g||g.state==='end'||g.state==='next')return;if(g.state==='paused'){begin();el('pause').textContent='Ⅱ ПАУЗА'}else{g.state='paused';holdingFire=false;keys.clear();el('pause').textContent='▶ ПУСК';show('ПАУЗА','Кот отдыхает. Собаки подождут.','ПРОДОЛЖИТЬ ▶',()=>{begin();el('pause').textContent='Ⅱ ПАУЗА'})}});el('sound').addEventListener('click',()=>{music=!music;save.audio=music;saveProgress();el('sound').textContent=music?'🔊':'🔇'});
window.addEventListener('keydown',e=>{let map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};if(map[e.code]){keys.add(map[e.code]);e.preventDefault()}if(e.code==='Space'){holdingFire=true;e.preventDefault()}if(e.code==='KeyB'){explode();e.preventDefault()}});window.addEventListener('keyup',e=>{let map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};if(map[e.code])keys.delete(map[e.code]);if(e.code==='Space')holdingFire=false});window.addEventListener('blur',()=>{keys.clear();holdingFire=false});el('center').addEventListener('click',()=>{if(g?.state==='playing')showPause();else showMenu()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)showPause()});
el('sound').textContent=music?'🔊':'🔇';
level(1);draw();showMenu();
window.__gameDebug={get:()=>g,level,drop,update,explode,finish};
window.__premiumDebug={getSave:()=>JSON.parse(JSON.stringify(save)),showMenu,buyUpgrade,saveProgress};
