name: Kototanki candidate checks
on:
  push:
    branches:
      - feature/commercial-candidate-20261022
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: State and gameplay tests
        run: npm test
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Chromium portrait and landscape
        run: node tests/browser-e2e.cjs
      - name: Save game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kototanki-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
