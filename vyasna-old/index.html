<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ВЯСНА — старая версия</title><style>html,body{margin:0;height:100%;background:#05070a;color:#fff;font-family:Arial,sans-serif}#load{height:100%;display:grid;place-items:center;text-align:center;font-size:20px}.bar{width:min(70vw,420px);height:10px;background:#222;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#ffc400}</style></head><body><div id="load"><div>Загрузка игры…<div class="bar"><i id="b"></i></div></div></div><script>(async()=>{const n=21,a=[];for(let i=0;i<n;i++){const p='parts/part-'+String(i).padStart(2,'0')+'.txt';const r=await fetch(p,{cache:'force-cache'});if(!r.ok)throw new Error('part '+i);a.push(await r.text());document.getElementById('b').style.width=((i+1)/n*100)+'%'}const h=a.join('');document.open();document.write(h);document.close()})().catch(e=>{document.getElementById('load').innerHTML='<div>Ошибка загрузки игры.<br>Обнови страницу.</div>';console.error(e)})</script></body></html>
